name: WPF CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags:
      - 'v*' # Triggers the deployment phase only when you push a tag like v1.0.0
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Gives the runner permission to create a GitHub Release and upload files
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0' # Match your target version

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build WPF Application
      run: dotnet build --configuration Release --no-restore

    - name: Run MSTests
      run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

  deploy:
    runs-on: windows-latest
    needs: build-and-test # 👈 This ensures deployment ONLY happens if tests pass!
    if: startsWith(github.ref, 'refs/tags/v') # 👈 This ensures deployment ONLY happens on version tags!
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Publish WPF App (Compile to clean production folder)
      run: dotnet publish --configuration Release -o ./publish_output /p:PublishProfile=Properties\PublishProfiles\FolderProfile.pubxml

    - name: Zip the Application Binaries
      run: Compress-Archive -Path ./publish_output/* -DestinationPath ./PackCircle_${{ github.ref_name }}.zip

    - name: Create GitHub Release and Upload Zip
      uses: softprops/action-gh-release@v2
      with:
        files: ./PackCircle_${{ github.ref_name }}.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
