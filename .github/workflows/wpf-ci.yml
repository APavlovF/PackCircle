name: WPF CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # WPF requires Windows to build and run properly
    runs-on: windows-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0' # Match this to your WPF app version (e.g., 6.0, 8.0, 9.0)

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build WPF Application
      run: dotnet build --configuration Release --no-restore

    - name: Run MSTests
      run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always() # Ensures test logs upload even if tests fail
      with:
        name: mstest-results
        path: '**/TestResults/test-results.trx'
